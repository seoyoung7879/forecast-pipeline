name: Daily Solar Forecast

on:
  schedule:
    - cron: "30 5 * * *"   # UTC 05:30 = 한국시간(KST) 14:30
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: 리포지토리 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 라이브러리 설치
        run: pip install pandas requests joblib python-dotenv pvlib pytz lightgbm scikit-learn

      - name: 예측 실행
        env:
          SOLAR_API_KEY: ${{ secrets.SOLAR_API_KEY }}
        run: python predict.py

      - name: 결과 커밋 및 푸시
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add predictions.db
          git commit -m "일일 예측 자동 업데이트 $(date +'%Y-%m-%d')" || echo "변경사항 없음"
          git push