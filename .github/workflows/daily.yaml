name: daily-forecast
on:
  workflow_dispatch:
  schedule:
    - cron: "37 23 * * *"   # 매일 KST 08:37
    - cron: "37 7 * * *"    # 매일 KST 16:37

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SOLAR_API_KEY: ${{ secrets.SOLAR_API_KEY }}
      DB_HOST: ${{ secrets.DB_HOST }}
      DB_PORT: ${{ secrets.DB_PORT }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      DB_NAME: ${{ secrets.DB_NAME }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirement.txt
      - run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          grep -v '^torch' requirement.txt | pip install -r /dev/stdin
      - run: python 코드/jobs/daily_predict.py
      - run: python 코드/jobs/fcst_archive.py
        if: always()